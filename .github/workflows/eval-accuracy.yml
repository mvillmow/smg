# Reproduce a published accuracy number through SMG's serving path.
#
# Manual dispatch only, on purpose. This lane answers "is our serving of this
# model faithful?", which is a question worth asking when a model family is
# added or its parsers change — not every night. Scheduling it would spend GPU
# hours re-confirming a number that only moves when we move it.
#
# See scripts/eval/README.md for what a run does and does not prove.
name: Eval Accuracy

on:
  workflow_dispatch:
    inputs:
      model:
        description: "HF model id to serve and score"
        required: false
        default: "meta-models/Muse-Glimmer-30B"
      suite:
        description: "Suite from scripts/eval/suites.py"
        required: false
        default: "aime_2026"
      runs:
        description: "Runs to average (0 = the reference's published run count)"
        required: false
        default: "0"
      tp:
        description: "Tensor-parallel size (must match the GPU count below)"
        required: false
        default: "2"
      gpu:
        description: "CUDA_VISIBLE_DEVICES for the arm"
        required: false
        default: "0,1"
      concurrency:
        description: "In-flight requests against the arm"
        required: false
        default: "16"
      max_tokens:
        description: "Override max_tokens (0 = the reference's)"
        required: false
        default: "0"
      extra_args:
        description: "Extra flags for run_eval.py (e.g. --no-top-k)"
        required: false
        default: ""

concurrency:
  group: eval-accuracy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build-wheel:
    runs-on: k8s-runner-cpu
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Cache wheel artifacts
        id: cache-wheel
        uses: actions/cache@v6
        with:
          path: |
            bindings/python/dist/*.whl
          key: nightly-wheel-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'crates/**/src/**', 'model_gateway/src/**', 'bindings/python/src/**') }}
          restore-keys: |
            nightly-wheel-${{ runner.os }}-
      - name: Setup Rust
        if: steps.cache-wheel.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-rust
      - name: Setup Python venv
        if: steps.cache-wheel.outputs.cache-hit != 'true'
        run: bash scripts/ci_setup_python_venv.sh
      - name: Build Python wheel
        if: steps.cache-wheel.outputs.cache-hit != 'true'
        run: bash scripts/ci_build_wheel.sh
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: smg-wheel
          path: bindings/python/dist/*.whl
          retention-days: 7

  eval:
    name: eval ${{ github.event.inputs.suite }} ${{ github.event.inputs.model }}
    needs: build-wheel
    runs-on: 4-gpu-h100
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      ROUTER_LOCAL_MODEL_PATH: /models
      HF_HOME: /models
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODEL: ${{ github.event.inputs.model }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: smg-wheel
          path: wheel
      - name: Setup SGLang env (provides sglang + grpc servicer + smg)
        uses: ./.github/actions/setup-sglang
      - name: Install smg wheel
        run: |
          pip uninstall -y smg || true
          pip install wheel/*.whl
      - name: Stage model weights
        run: |
          if [ -d "$ROUTER_LOCAL_MODEL_PATH/$MODEL" ]; then
            echo "model present at $ROUTER_LOCAL_MODEL_PATH/$MODEL — skipping download"
          else
            bash scripts/ci_download_model.sh "$MODEL"
          fi

      - name: Launch arm and score it
        id: score
        env:
          BFCL_MODEL: ${{ env.MODEL }}
          BFCL_ARM_B_WORKER: sglang
          BFCL_GPU: ${{ github.event.inputs.gpu }}
          BFCL_TP: ${{ github.event.inputs.tp }}
          # Reasoning benchmarks generate long chains of thought; a 16k window
          # truncates them and the answer never arrives.
          BFCL_MAX_MODEL_LEN: "65536"
          BFCL_STARTUP_TIMEOUT: "1200"
          BFCL_RUN_DIR: ${{ runner.temp }}/eval_run
          SGLANG_PYTHON: python
          SMG_LAUNCH: "python -m smg.launch_router"
          # Left empty deliberately: SMG auto-detects the parsers from the model
          # id, and this lane should exercise that path rather than paper over a
          # broken glob by naming the parser explicitly.
          BFCL_SMG_TOOL_PARSER: ""
          BFCL_SMG_REASONING_PARSER: ""
        run: |
          set -uo pipefail
          mkdir -p "$BFCL_RUN_DIR"

          BASE_URL="$(bash scripts/bfcl/launch_arm.sh b)"
          echo "arm serving at $BASE_URL"

          EXTRA="${{ github.event.inputs.extra_args }}"
          RUNS="${{ github.event.inputs.runs }}"
          MAX_TOKENS="${{ github.event.inputs.max_tokens }}"

          set +e
          python scripts/eval/run_eval.py \
            --base-url "$BASE_URL" \
            --model "$MODEL" \
            --suite "${{ github.event.inputs.suite }}" \
            --runs "$RUNS" \
            --max-tokens "$MAX_TOKENS" \
            --concurrency "${{ github.event.inputs.concurrency }}" \
            --out "$BFCL_RUN_DIR/report.md" \
            --json-out "$BFCL_RUN_DIR/results.json" \
            $EXTRA
          EVAL_EXIT=$?
          set -e
          echo "eval_exit=$EVAL_EXIT" >> "$GITHUB_OUTPUT"

          bash scripts/bfcl/launch_arm.sh stop || true
          exit "$EVAL_EXIT"

      - name: Render summary
        if: always()
        run: |
          REPORT="${{ runner.temp }}/eval_run/report.md"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced — the arm never scored anything." >> "$GITHUB_STEP_SUMMARY"
          fi
          case "${{ steps.score.outputs.eval_exit }}" in
            2) echo "" >> "$GITHUB_STEP_SUMMARY"
               echo "> **Not comparable.** The run failed to produce a scoreable result, so this is not a regression signal — check the arm logs." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Upload results and arm logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-${{ github.event.inputs.suite }}
          path: |
            ${{ runner.temp }}/eval_run/report.md
            ${{ runner.temp }}/eval_run/results.json
            ${{ runner.temp }}/eval_run/*.log
          retention-days: 14

      - name: Teardown backstop
        if: always()
        run: bash scripts/bfcl/launch_arm.sh stop || true
